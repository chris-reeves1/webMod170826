<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox and Radio Button Example</title>
</head>
<body>
    <h1>Select Your Preferences</h1>
    <form>
        <p>Please select all that apply:</p>
        <!-- Checkbox Inputs -->
        <label>
            <input type="checkbox" name="preference" value="preference1">
            Preference 1
        </label>
        <br>
        <label>
            <input type="checkbox" name="preference" value="preference2">
            Preference 2
        </label>
        <br>
        <label>
            <input type="checkbox" name="preference" value="preference3">
            Preference 3
        </label>
        <br><br>

        <p>Please select one option:</p>
        <!-- Radio Button Inputs -->
        <label>
            <input type="radio" name="option" value="option1">
            Option 1
        </label>
        <br>
        <label>
            <input type="radio" name="option" value="option2">
            Option 2
        </label>
        <br>
        <label>
            <input type="radio" name="option" value="option3">
            Option 3
        </label>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
