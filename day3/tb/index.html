<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Details Demo</title>
    <script src="js/script.js" defer></script>
</head>

<body>

    <h1>People</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>

        <tbody id="peopleTable">
        </tbody>
    </table>


    <h2>Selected Person Details</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Age</th>
                <th>Weight</th>
                <th>Height</th>
            </tr>
        </thead>

        <tbody id="detailsTable">
            <tr>
                <td colspan="4">Select a person</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
