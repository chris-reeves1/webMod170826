<!DOCTYPE html> 
<!-- lets the browser know to use html5 -->
<html lang="en">
<!-- head contains metadata - doesnt appear visually on the rendered page.  -->
<head>
    <!-- Servers can override this behaviour -->
    <base href="https://www.duckduckgo.com/">
    <script defer>
        console.log("Hello World");
    </script>
    <title>Document</title>
    <link rel="icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- essential scaling for mobile and tablet -->
     <style>
        body {
            background-color: lightblue;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            color: darkblue;
        }
        </style>
</head>

<body>
    <h1>My First Heading</h1>
    <p>My first paragraph.</p>    
    <a href="about">GO to about page</a>
</body>
</html>
