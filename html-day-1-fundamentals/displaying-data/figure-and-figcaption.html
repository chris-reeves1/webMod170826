<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure with Figcaption</title>
</head>
<body>
    <h1>Image with Caption</h1>
    <!-- figure can contain images, illustrations, diagrams, or other media, along 
    with a caption that describes the content. 
    The figcaption element provides a caption for the figure, 
    enhancing accessibility and context for users. -->
    <figure>
        <img src="https://i.pravatar.cc/200" alt="Random Avatar">
        <figcaption>A randomly generated avatar image.</figcaption>
    </figure>
</body>
</html>
