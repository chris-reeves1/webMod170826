<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time and Datetime Example</title>
</head>
<body>
    <h1>Event Schedule</h1>
    <p>The event starts at: <time datetime="2026-08-17T10:00">August 17, 2026, 10:00 AM</time></p>
    <p>The event ends at: <time datetime="2026-08-17T15:00">August 17, 2026, 3:00 PM</time></p>
</body>
</html>
